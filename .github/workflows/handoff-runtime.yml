name: Handoff runtime

on:
  pull_request:
    paths:
      - .github/workflows/handoff-runtime.yml
      - .punt-labs/ethos/checks/snapshots/crypt-go.yaml
      - Makefile
      - go.mod
      - go.sum
      - scripts/build-handoff-runtime.sh
      - scripts/smoke-handoff-snapshot.sh
      - scripts/handoff-runtime/**
  workflow_dispatch:
    inputs:
      tag:
        description: New runtime release tag, e.g. handoff-runtime-v1
        required: true
        type: string

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, darwin-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Build and verify the pinned archive
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ inputs.tag }}
        run: |
          sidecar=.punt-labs/ethos/checks/snapshots/crypt-go.yaml
          pin='.checks["handoff-gate"].runtime.platforms[strenv(PLATFORM)]'
          asset="cryptd-handoff-$PLATFORM.tar.gz"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main || ! "$TAG" =~ ^handoff-runtime-v[1-9][0-9]*$ ]]; then
              echo 'Dispatch on main with a new handoff-runtime-vN tag.' >&2
              exit 2
            fi
            url=$(yq -er "$pin.url" "$sidecar")
            [[ "$url" == "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset" ]]
          fi
          mkdir runtime-assets
          bash scripts/build-handoff-runtime.sh "$PLATFORM" runtime-assets
          sha=$(yq -er "$pin.sha256" "$sidecar")
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          cd runtime-assets
          printf '%s  %s\n' "$sha" "$asset" > "$asset.sha256"
          sha256sum --check "$asset.sha256"
      - name: Verify Markdown lint resolves offline from the archive
        if: matrix.platform == 'linux-amd64'
        run: |
          scratch=$(mktemp -d)
          trap 'chmod -R u+w "$scratch" && rm -rf -- "$scratch"' EXIT
          mkdir "$scratch/runtime" "$scratch/home"
          tar -xzf runtime-assets/cryptd-handoff-linux-amd64.tar.gz -C "$scratch/runtime"
          sudo --non-interactive unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            env -i HOME="$scratch/home" PATH="$scratch/runtime/node/bin:/usr/bin:/bin" \
            npm_config_cache="$scratch/npm" npm_config_offline=true make markdownlint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.platform }}
          path: runtime-assets/
          compression-level: 0
          if-no-files-found: error

  smoke-darwin:
    needs: build
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-darwin-arm64
          path: runtime-assets
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Build Ethos with fetch-runtime support
        run: |
          GOBIN="$RUNNER_TEMP/ethos-bin" CGO_ENABLED=0 go install \
            github.com/punt-labs/ethos/v4/cmd/ethos@038e901628e9772add514350b24c8d8f6fb6d0f6
      - name: Verify local install and bundled tools on macOS arm64
        run: |
          scratch=$(mktemp -d)
          trap 'chmod -R u+w "$scratch" && rm -rf -- "$scratch"' EXIT
          sha=$(yq -er '.checks["handoff-gate"].runtime.platforms.darwin-arm64.sha256' \
            .punt-labs/ethos/checks/snapshots/crypt-go.yaml)
          mkdir "$scratch/home"
          archive=$(HOME="$scratch/home" "$RUNNER_TEMP/ethos-bin/ethos" handoff fetch-runtime \
            --file runtime-assets/cryptd-handoff-darwin-arm64.tar.gz)
          [[ "$archive" == "$scratch/home/.punt-labs/ethos/runtimes/$sha.tar.gz" ]]
          printf '%s  %s\n' "$sha" "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$scratch"
          GOTOOLCHAIN=local "$scratch/go/bin/go" version
          "$scratch/bin/staticcheck" -version
          "$scratch/node/bin/node" --version

  smoke-linux:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-linux-amd64
          path: ${{ runner.temp }}/runtime-assets
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Build Ethos with fetch-runtime support
        run: |
          GOBIN="$RUNNER_TEMP/ethos-bin" CGO_ENABLED=0 go install \
            github.com/punt-labs/ethos/v4/cmd/ethos@038e901628e9772add514350b24c8d8f6fb6d0f6
      - name: Verify the Linux handoff with the built runtime
        run: |
          mkdir -p .tmp
          scratch=$(mktemp -d "$PWD/.tmp/handoff-runtime.XXXXXX")
          trap 'chmod -R u+w "$scratch" && rm -rf -- "$scratch"' EXIT
          ethos="$RUNNER_TEMP/ethos-bin/ethos"
          HOME="$scratch" "$ethos" handoff fetch-runtime \
            --file "$RUNNER_TEMP/runtime-assets/cryptd-handoff-linux-amd64.tar.gz"
          bash scripts/smoke-handoff-snapshot.sh "$ethos" "$scratch"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, smoke-darwin, smoke-linux]
    concurrency: handoff-runtime-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: runtime-assets
          merge-multiple: true
      - name: Publish verified runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        working-directory: runtime-assets
        run: |
          [[ "$TAG" =~ ^handoff-runtime-v[1-9][0-9]*$ ]]
          sha256sum --check cryptd-handoff-linux-amd64.tar.gz.sha256 cryptd-handoff-darwin-arm64.tar.gz.sha256
          gh release create "$TAG" ./*.tar.gz ./*.sha256 --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "cryptd handoff runtime $TAG" --notes-file /dev/null
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')
          if [[ -n "$notes" ]]; then
            echo 'Runtime release notes must be empty to stay out of the website release feed.' >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

  smoke-published:
    needs: publish
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-22.04
          - platform: darwin-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Build Ethos with fetch-runtime support
        run: |
          GOBIN="$RUNNER_TEMP/ethos-bin" CGO_ENABLED=0 go install \
            github.com/punt-labs/ethos/v4/cmd/ethos@038e901628e9772add514350b24c8d8f6fb6d0f6
      - name: Verify the published runtime and replay the Linux handoff
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          pin='.checks["handoff-gate"].runtime.platforms[strenv(PLATFORM)]'
          sha=$(yq -er "$pin.sha256" .punt-labs/ethos/checks/snapshots/crypt-go.yaml)
          archive=$(HOME="$scratch" "$RUNNER_TEMP/ethos-bin/ethos" handoff fetch-runtime)
          [[ "$archive" == "$scratch/.punt-labs/ethos/runtimes/$sha.tar.gz" ]]
          printf '%s  %s\n' "$sha" "$archive" | shasum -a 256 -c -
          if [[ "$PLATFORM" == linux-amd64 ]]; then
            bash scripts/smoke-handoff-snapshot.sh "$RUNNER_TEMP/ethos-bin/ethos" "$scratch"
          fi
