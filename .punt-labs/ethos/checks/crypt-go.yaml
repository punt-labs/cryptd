name: crypt-go
description: Scoped advisory edit feedback; full gate at commit and handoff.
checks:
  - name: gofmt
    stage: edit
    files: ["**/*.go"]
    run: ["gofmt", "-l", "{file}"]
    fail_on_output: true
    on_fail: advisory
    timeout: 5s
  - name: vet
    stage: edit
    files: ["**/*.go"]
    run: ["go", "vet", "-tags", "integration,e2e,acceptance", "{package_dir}"]
    on_fail: advisory
    timeout: 20s
  - name: package-tests
    stage: edit
    files: ["**/*.go"]
    exclude: ["e2e/**"]
    run: ["go", "test", "-race", "-count=1", "-tags", "integration", "{package_dir}"]
    on_fail: advisory
    timeout: 30s
  - name: shellcheck
    stage: edit
    files: ["**/*.sh"]
    run: ["shellcheck", "{file}"]
    on_fail: advisory
  - name: commit-gate
    stage: commit
    files: all
    adapter: make
    target: check
    on_fail: block
    timeout: 10m
  - name: handoff-gate
    stage: handoff
    files: all
    adapter: make
    target: check
    on_fail: block
    timeout: 20m
